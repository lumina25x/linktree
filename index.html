<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>살림알파 | SNS 영상 속 살림 꿀템 모음</title>
  <meta name="description" content="틱톡, 릴스, 스레드 영상 속 화제의 살림 꿀템 번호별 최저가 링크 모음" />

  <!-- Open Graph / SNS Preview -->
  <meta property="og:title" content="살림알파 | 영상 속 살림 꿀템 모음" />
  <meta property="og:description" content="영상에서 보신 번호를 검색하시면 바로 최저가 링크로 연결됩니다." />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Main Mobile-Optimized Application Container -->
  <div class="app-container">

    <!-- 1. Top Utility Action Bar (Business, Admin & Share) -->
    <div class="top-action-bar">
      <div style="display: flex; gap: 8px; align-items: center;">
        <a id="btn-business" href="mailto:salim_alpha@gmail.com" class="btn-business" title="비즈니스 문의">
          <span>✉️ 비즈니스 제안</span>
        </a>
        <a href="admin.html" class="btn-business" title="실시간 클릭 통계 대시보드" style="color: var(--accent-blue);">
          <span>📊 통계 대시보드</span>
        </a>
      </div>
      <button id="btn-share" class="btn-share" title="링크 공유하기" aria-label="Share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>
    </div>

    <!-- 2. Channel Profile & Header -->
    <header class="header-section">
      <div class="avatar-wrapper">
        <img id="channel-avatar" class="avatar-img" src="" alt="Profile Avatar" />
      </div>
      <div>
        <div class="channel-title-row">
          <h1 id="channel-title" class="channel-title">살림알파</h1>
        </div>
        <p id="channel-tagline" class="channel-tagline">삶의 질을 높여주는 살림 꿀템 모음 💛</p>
      </div>

      <!-- Social Media Icons (TikTok, Instagram, Threads, YouTube) -->
      <div id="social-links-container" class="social-links">
        <!-- Dynamically injected from config.js -->
      </div>
    </header>

    <!-- 3. Top Notice / Coupang Partners Legal Disclaimer (상단 배치) -->
    <div class="top-notice-box">
      <span class="top-notice-icon">📢</span>
      <p id="top-notice-text">
        쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>
    </div>

    <!-- 4. Sticky Live Search Section -->
    <section class="search-sticky-container">
      <div class="search-box-wrapper" style="margin-bottom: 0;">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="🔍 영상 번호(예: 014) 또는 상품명 검색" 
          autocomplete="off"
          inputmode="search"
        />
        <button id="clear-search-btn" class="clear-search-btn" title="검색어 지우기">✕</button>
      </div>
    </section>

    <!-- 5. Product Rows List Section (Clean Inpocklink Style) -->
    <main class="product-section">
      <div class="section-header-info">
        <div class="product-count-text">
          등록된 상품 <span id="product-count">0</span>개
        </div>
        <select id="sort-select" class="sort-select">
          <option value="newest">최신 번호순</option>
          <option value="price_asc">낮은 가격순</option>
          <option value="price_desc">높은 가격순</option>
        </select>
      </div>

      <!-- Compact Row Cards Target Container -->
      <div id="products-container" class="product-cards-container">
        <!-- Rendered by app.js -->
      </div>

      <!-- Empty State View -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-state-icon">🔎</div>
        <h3 class="empty-state-title">검색된 상품이 없습니다</h3>
        <p>영상 속 다른 상품 번호나 키워드로 검색해 보세요.</p>
      </div>
    </main>

    <!-- 6. Footer -->
    <footer class="footer-section">
      <div style="margin-bottom: 8px;">
        <a href="admin.html" style="font-size: 0.76rem; color: var(--text-sub); text-decoration: none; font-weight: 600;">
          📊 관리자 클릭 통계 페이지 이동 ❯
        </a>
      </div>
      <p class="copyright-text">
        © <span id="current-year">2026</span> 살림알파. All rights reserved.
      </p>
    </footer>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-msg">링크가 클립보드에 복사되었습니다.</div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/data-source.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
